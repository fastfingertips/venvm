[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "venvm"
dynamic = ["version"]
description = "Select a virtual environment and run Python scripts or modules."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "FastFingertips" },
]
keywords = ["cli", "python", "venv", "virtual-environment"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
]
dependencies = []

[project.scripts]
venvm = "venvm.cli:main"

[project.urls]
Repository = "https://github.com/fastfingertips/venvm"
Issues = "https://github.com/fastfingertips/venvm/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "venvm.__version__" }
